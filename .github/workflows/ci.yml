name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: .cache/maven
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - run: mvn --batch-mode verify
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    env:
      npm_config_cache: ${{ github.workspace }}/.cache/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  qa-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/asset-query.test.mjs

  playwright-health:
    runs-on: ubuntu-latest
    env:
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/npdemo
      DATABASE_USERNAME: npdemo
      DATABASE_PASSWORD: npdemo
      NPDEMO_QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NPDEMO_QA_DISPOSABLE_DB: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: npdemo
          POSTGRES_USER: npdemo
          POSTGRES_PASSWORD: npdemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npdemo -d npdemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .cache/maven
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - uses: actions/cache@v4
        with:
          path: .cache/npm
          key: ${{ runner.os }}-npm-qa-${{ hashFiles('frontend/package-lock.json', 'test/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-qa-
      - uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('test/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: test
      - run: npx playwright install --with-deps chromium
        working-directory: test
      - run: npm run test:all
        working-directory: test
