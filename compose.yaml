services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-npdemo}
      POSTGRES_USER: ${POSTGRES_USER:-npdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-npdemo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-npdemo}
      DATABASE_USERNAME: ${POSTGRES_USER:-npdemo}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-npdemo}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
